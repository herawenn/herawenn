name: Generate Contribution Snake

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit and Push Snake Animation
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action (Snake)"
          if ! git diff --quiet -- dist/github-contribution-grid-snake*.svg dist/ocean.gif 2>/dev/null || true; then
            git add dist/github-contribution-grid-snake*.svg dist/ocean.gif # Add all potential output files
            git commit -m "Chore: Updated contribution snake animation 🐍"
            git push
          else
            echo "No changes to snake animation. Skipping commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
